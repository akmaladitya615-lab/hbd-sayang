<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu pujaan hatiku❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

/* BACKGROUND */
body{
margin:0;
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
overflow-y:auto;
padding:40px 15px;
}

/* CARD */
.card{
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
padding:40px;
border-radius:25px;
width:90%;
max-width:720px;
box-shadow:0 20px 50px rgba(0,0,0,.15);
text-align:center;
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;}
}

h1{color:#ff4d6d;}

button{
padding:12px 24px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
margin:8px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

#text{
line-height:1.9;
min-height:100px;
}

/* ===== ALBUM FOTO ===== */
.gallery{
margin-top:30px;
display:none;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:18px;
}

.gallery img{
width:100%;
height:170px;
object-fit:cover;
border-radius:12px;
background:white;
padding:8px;
box-shadow:0 10px 20px rgba(0,0,0,.15);
opacity:0;
transform:scale(.8) rotate(-3deg);
transition:1s;
}

.gallery img:nth-child(even){
transform:scale(.8) rotate(3deg);
}

.gallery img:hover{
transform:scale(1.08) rotate(0deg);
}

/* HEART */
.heart{
position:fixed;
animation:float 6s linear infinite;
pointer-events:none;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

</style>
</head>

<body>

<div class="card">

<h1 id="title">Hai kamu 😄</h1>

<p id="text">
Aku mau kasih kamu sesuatu... 
</p>

<div id="buttons">
<button onclick="startStory()">Siap ❤️</button>
<button id="runBtn" onmouseover="runAway()">Nggak 😜</button>
</div>

<!-- tombol buka album -->
<div id="openAlbum" style="display:none;">
<button onclick="showAlbum()">📸 Lihat Kenangan Kita</button>
<p style="font-size:13px;opacity:.6;">klik pelan ya… ini bagian favorit 🙂</p>
</div>

<!-- ALBUM -->
<div class="gallery" id="gallery">
<img src="fotbar.jpeg">
<img src="foto1.jpeg">
<img src="foto2.jpeg">
<img src="foto3.jpeg">
<img src="foto4.jpeg">
<img src="foto5.jpeg">
</div>

</div>

<script>
const text = document.getElementById("text");
const title = document.getElementById("title");

/* tombol kabur lucu */
function runAway() {
    const btn = document.getElementById("runBtn");
    btn.style.position = "absolute";
    btn.style.top = Math.random() * 80 + "%";
    btn.style.left = Math.random() * 80 + "%";
}

/* STORY AWAL */
const story = [
    "Eh bentar sayang jangan buru-buru 😄",
    "Kamu duduk santai dulu...",
    "Tarik napas… buang pelan 🙂",
    "Sudah siap sayang? ❤️",
    "Aku ada sesuatu yang ingin aku ungkapkan...",
    "Dan semuanya tentang kamu sayang ✨"
];

let i = 0;

function startStory() {
    document.getElementById("buttons").style.display = "none";
    nextStory();
}

function nextStory() {
    if (i < story.length) {
        text.innerHTML = story[i];
        i++;
        setTimeout(nextStory, 2500);
    } else {
        finalMessage();
    }
}

/* PESAN ULANG TAHUN */
function finalMessage() {
    title.innerHTML = "Happy Birthday sayangg ❤️";
    
    // Menggunakan backtick (tombol sebelah angka 1) agar bisa menulis teks panjang antar baris
    text.innerHTML = `
        Hari ini bukan cuma tentang usiamu yang bertambah, tapi tentang betapa bersyukurnya aku karena setiap tahunnya aku masih bisa melihat senyum yang sama. Stay as wonderful as you are 🥹✨<br><br>
        
        Tentang seseorang yang tanpa sadar berhasil membuat duniaku jadi lebih hangat hanya dengan menjadi dirinya sendiri. Dan orang itu… ya kamu sayangg ❤️<br><br>
        
        Mungkin aku nggak bisa menjanjikan dunia untukmu, tapi aku janji akan selalu ada di setiap langkahmu, baik saat kamu terbang tinggi maupun saat kamu lelah 😊<br><br>
        
        Dunia mungkin melihatmu bertambah usia, tapi aku melihatmu bertambah berharga. Di bab baru usiamu ini, aku berdoa agar kamu selalu punya kekuatan untuk mengubah hari buruk menjadi cerita hebat.<br><br>
        
        Terima kasih sudah memilih untuk tumbuh sespesial ini. Kalau suatu saat langkahmu berat, aku akan jadi alasanmu untuk tetap berdiri. Love you to the moon and back! 🌙🚀<br><br>
        
        <i>Oh iya… semoga makin dewasa, tapi jangan berhenti jadi lucu ya 😜❤️</i>
    `;

    text.style.textAlign = "left"; // Agar teks panjang lebih rapi dibaca

    setTimeout(() => {
        document.getElementById("openAlbum").style.display = "block";
    }, 3000);
}

/* TAMPILKAN ALBUM */
function showAlbum() {
    title.innerHTML = "Kenangan Indah Kita 📸❤️";
    const gallery = document.getElementById("gallery");
    gallery.style.display = "grid";

    const imgs = gallery.querySelectorAll("img");
    imgs.forEach((img, index) => {
        setTimeout(() => {
            img.style.opacity = 1;
            img.style.transform = "scale(1) rotate(0deg)";
        }, index * 400);
    });
    startHearts();
}

/* HEART ANIMATION */
function startHearts() {
    setInterval(() => {
        let h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "❤️";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (Math.random() * 20 + 15) + "px";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6000);
    }, 400);
}

</script>

<audio id="music" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", function(){
  document.getElementById("music").play();
});
</script>

</body>
</html>
